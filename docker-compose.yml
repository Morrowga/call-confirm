# LOCAL DEVELOPMENT: app + Postgres + Redis as containers, hot-reload enabled.
# Uses the same Dockerfile/image as production; only env/config differ.
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - .:/srv/app          # hot reload for local iteration
      - recordings_data:/srv/app/data/recordings
    ports:
      - "8000:8000"
    depends_on: [db, redis]

  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    env_file: .env
    volumes:
      - .:/srv/app
      - recordings_data:/srv/app/data/recordings
    depends_on: [db, redis]

  beat:
    build: .
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    env_file: .env
    volumes:
      - .:/srv/app
    depends_on: [db, redis]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: callconfirm
      POSTGRES_PASSWORD: callconfirm
      POSTGRES_DB: callconfirm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  recordings_data: